<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meeting2Action 看板</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <script defer src="./dist/main.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Meeting2Action</p>
          <h1>任务看板</h1>
          <p class="hero-copy">查看 AI 生成任务、切换任务状态，并直接读取实验室当前推进节奏。</p>
        </div>
        <div class="hero-actions">
          <button id="refresh-board" class="secondary-button">刷新看板</button>
        </div>
      </header>

      <section id="stats-panel" class="stats-grid"></section>

      <section class="filter-card">
        <div class="section-heading compact-heading">
          <div>
            <p class="eyebrow">Board Filter</p>
            <h2>任务筛选与风险视图</h2>
          </div>
          <button id="reset-filters" class="secondary-button">重置筛选</button>
        </div>
        <div class="filter-grid">
          <label>
            <span>状态</span>
            <select id="status-filter">
              <option value="all">全部状态</option>
              <option value="todo">todo</option>
              <option value="doing">doing</option>
              <option value="done">done</option>
            </select>
          </label>
          <label>
            <span>负责人</span>
            <select id="owner-filter">
              <option value="all">全部负责人</option>
            </select>
          </label>
          <label>
            <span>风险</span>
            <select id="risk-filter">
              <option value="all">全部任务</option>
              <option value="overdue">仅看逾期</option>
              <option value="dueSoon">仅看即将到期</option>
              <option value="highPriority">仅看高优先级</option>
            </select>
          </label>
        </div>
      </section>

      <main class="board-layout">
        <section class="board-section">
          <section class="import-section">
            <div class="import-card">
              <div class="section-heading">
                <div>
                  <p class="eyebrow">Import Review</p>
                  <h2>任务导入确认</h2>
                </div>
                <div class="import-actions">
                  <button id="load-sample" class="secondary-button">载入示例</button>
                  <button id="preview-import" class="secondary-button">解析预览</button>
                  <button id="submit-import" class="primary-button">确认导入</button>
                </div>
              </div>

              <div class="import-meta-grid">
                <label>
                  <span>会议 ID</span>
                  <input id="meeting-id-input" type="text" value="meeting_001" />
                </label>
                <label>
                  <span>操作人</span>
                  <input id="operator-name-input" type="text" value="蒙亚舟" />
                </label>
              </div>

              <label class="import-json-field">
                <span>ActionItems JSON</span>
                <textarea id="import-json" rows="10" placeholder="粘贴模块 2 输出的 ActionItems JSON"></textarea>
              </label>

              <div id="import-feedback" class="import-feedback empty-state">载入示例或粘贴 JSON 后，点击“解析预览”。</div>
              <div id="import-preview" class="import-preview empty-state">暂无待确认任务。</div>
            </div>
          </section>

          <div id="board-columns" class="board-columns"></div>
        </section>
        <aside class="detail-section">
          <div class="detail-card">
            <div class="detail-header">
              <p class="eyebrow">Task Detail</p>
              <h2>任务详情</h2>
            </div>
            <div id="task-detail" class="detail-content empty-state">
              点击左侧任务卡片，查看详细信息与活动记录。
            </div>
          </div>
        </aside>
      </main>

      <section class="resource-section">
        <div class="resource-shell">
          <article class="resource-card">
            <div class="section-heading">
              <div>
                <p class="eyebrow">Member Admin</p>
                <h2>成员管理</h2>
              </div>
              <button id="refresh-members" class="secondary-button">刷新成员</button>
            </div>

            <div class="resource-form-grid">
              <label>
                <span>姓名</span>
                <input id="member-name-input" type="text" placeholder="例如：蒙亚舟" />
              </label>
              <label>
                <span>年级</span>
                <input id="member-grade-input" type="text" placeholder="例如：2024级" />
              </label>
              <label>
                <span>培养层次</span>
                <select id="member-degree-type-input">
                  <option value="master">master</option>
                  <option value="phd">phd</option>
                </select>
              </label>
              <div class="resource-form-action">
                <button id="create-member" class="primary-button">新增成员</button>
              </div>
            </div>

            <div id="member-feedback" class="import-feedback empty-state">创建成员后，这里会显示反馈。</div>
            <div id="member-list" class="resource-list empty-state">成员列表加载中...</div>
          </article>

          <article class="resource-card">
            <div class="section-heading">
              <div>
                <p class="eyebrow">Meeting Admin</p>
                <h2>会议管理</h2>
              </div>
              <button id="refresh-meetings" class="secondary-button">刷新会议</button>
            </div>

            <div class="resource-form-grid resource-form-grid-wide">
              <label>
                <span>会议主题</span>
                <input id="meeting-topic-input" type="text" placeholder="例如：任务联调会" />
              </label>
              <label>
                <span>会议时间</span>
                <input id="meeting-time-input" type="text" placeholder="例如：2026-04-20 19:00:00" />
              </label>
              <label>
                <span>会议地点</span>
                <input id="meeting-location-input" type="text" placeholder="例如：复旦大学实验室 A201" />
              </label>
            </div>

            <div class="participant-picker-block">
              <div class="participant-picker-header">
                <span>创建会议时的参会人</span>
                <button id="clear-meeting-members" class="secondary-button small-button">清空选择</button>
              </div>
              <div id="meeting-member-picker" class="participant-picker empty-state">请先加载成员。</div>
            </div>

            <div class="resource-submit-row">
              <button id="create-meeting" class="primary-button">新增会议</button>
            </div>

            <div id="meeting-feedback" class="import-feedback empty-state">创建会议或调整参会人后，这里会显示反馈。</div>
            <div id="meeting-list" class="resource-list empty-state">会议列表加载中...</div>
          </article>
        </div>
      </section>
    </div>
  </body>
</html>
